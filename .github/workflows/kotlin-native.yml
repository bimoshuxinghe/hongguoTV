name: Verify Kotlin standalone APK
on:
  push:
    branches: ['codex/kotlin-standalone', 'main']
    tags: ['kotlin-v*']
  pull_request:
    paths: ['kotlin-tv/**', 'scripts/build-kotlin.sh', '.github/workflows/kotlin-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, Android lint, and signed APKs
        env:
          HONGGUOTV_KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: |
          if [ -n "$HONGGUOTV_KEYSTORE_B64" ]; then
            printf '%s' "$HONGGUOTV_KEYSTORE_B64" | base64 -d > kotlin-tv/release.jks
            export HONGGUOTV_KEYSTORE=release.jks
          fi
          ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kotlin-native-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-debug.*
            kotlin-tv/app/build/outputs/apk/debug/*.apk
            kotlin-tv/app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/kotlin-v')
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-native-verification
      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          apks=(**/outputs/apk/*/*.apk)
          test ${#apks[@]} -gt 0 || { echo "没有找到 APK 产物"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "hongguoTV $TAG" --notes "TV 端安装包（由 Verify Kotlin standalone APK 工作流构建）。debug 为调试签名，release 为发布签名。"
          gh release upload "$TAG" --clobber "${apks[@]}"
